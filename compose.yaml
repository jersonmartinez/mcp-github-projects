# ── MCP Docker Compose ────────────────────────────────────────────────────────
# Runs the MCP server as a local service with credentials from .env
#
# Setup:
#   1. cp .env.example .env
#   2. Edit .env with your token and target
#   3. docker compose -f compose.yaml up --build
#
# The MCP uses stdio transport — this compose is for development/test.
# In production, the MCP client invokes it directly with `docker run`.
# ─────────────────────────────────────────────────────────────────────────────

services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp_github_projects
    env_file:
      - .env
    environment:
      # GITHUB_TOKEN se lee del .env file
      # Si prefieres pasarlo desde tu shell:
      #   GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    stdin_open: true
    tty: false
    restart: "no"
    # Health check: verifica que Python y las tools cargan correctamente
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.path.insert(0,'/app'); import server; print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 1
    # No expone puertos — comunicación por stdio
    # No necesita volúmenes — stateless (cache es efímera por diseño)
